<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.5" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#faf5ff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#312e81" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="900" height="560" rx="16" fill="url(#bg)"/>
  <text x="24" y="34" font-size="13" fill="#6366f1" font-weight="600">/login  ·  /register</text>

  <!-- card -->
  <g filter="url(#sh)">
    <rect x="260" y="50" width="380" height="460" rx="18" fill="#ffffff" stroke="#f1f5f9"/>
  </g>
  <text x="450" y="104" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">Welcome Back</text>

  <text x="292" y="146" font-size="13" font-weight="600" fill="#374151">Email</text>
  <rect x="292" y="154" width="316" height="42" rx="8" fill="#fff" stroke="#d1d5db"/>
  <text x="308" y="180" font-size="14" fill="#9ca3af">you@example.com</text>

  <text x="292" y="222" font-size="13" font-weight="600" fill="#374151">Password</text>
  <rect x="292" y="230" width="316" height="42" rx="8" fill="#fff" stroke="#6366f1" stroke-width="2"/>
  <text x="308" y="257" font-size="16" fill="#6b7280">••••••••</text>

  <rect x="292" y="292" width="316" height="44" rx="8" fill="#4f46e5"/>
  <text x="450" y="319" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Login</text>

  <line x1="292" y1="370" x2="428" y2="370" stroke="#e5e7eb"/>
  <text x="450" y="375" text-anchor="middle" font-size="12" fill="#9ca3af" font-weight="600">OR</text>
  <line x1="472" y1="370" x2="608" y2="370" stroke="#e5e7eb"/>

  <rect x="292" y="394" width="316" height="42" rx="4" fill="#fff" stroke="#dadce0"/>
  <circle cx="318" cy="415" r="9" fill="none" stroke="#4285f4" stroke-width="3"/>
  <rect x="318" y="412" width="10" height="4" fill="#4285f4"/>
  <text x="460" y="420" text-anchor="middle" font-size="14" fill="#3c4043">Sign in with Google</text>

  <text x="450" y="476" text-anchor="middle" font-size="13" fill="#4b5563">Don't have an account? <tspan fill="#4f46e5" font-weight="600">Register here</tspan></text>

  <!-- annotations -->
  <g font-size="12" fill="#4338ca">
    <line x1="608" y1="314" x2="680" y2="314" stroke="#a5b4fc" stroke-dasharray="4 3"/>
    <text x="686" y="306">POST /api/auth/login</text>
    <text x="686" y="322" fill="#6b7280">sets httpOnly "token" cookie</text>

    <line x1="608" y1="415" x2="680" y2="415" stroke="#a5b4fc" stroke-dasharray="4 3"/>
    <text x="686" y="408">POST /api/auth/google</text>
    <text x="686" y="424" fill="#6b7280">body: { token: credential }</text>

    <line x1="292" y1="175" x2="220" y2="175" stroke="#a5b4fc" stroke-dasharray="4 3"/>
    <text x="214" y="170" text-anchor="end">Register page adds</text>
    <text x="214" y="186" text-anchor="end" fill="#6b7280">a "Name" field on top</text>
  </g>
</svg>
