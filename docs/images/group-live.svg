    <circle cx="1030" cy="131" r="16" fill="#4f46e5"/><text x="1030" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">L</text>
    <text x="1054" y="136" font-size="13" fill="#fff">Leo</text>
