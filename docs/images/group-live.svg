    <circle cx="1030" cy="189" r="16" fill="#4f46e5"/><text x="1030" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">P</text>
    <text x="1054" y="194" font-size="13" fill="#fff">Priya</text>
    <circle cx="1216" cy="189" r="14" fill="#15803d"/><text x="1216" y="194" text-anchor="middle" font-size="12" fill="#fff">✓</text>
    <circle cx="1250" cy="189" r="14" fill="#991b1b"/><text x="1250" y="194" text-anchor="middle" font-size="12" fill="#fff">✕</text>
  </g>
  <line x1="994" y1="592" x2="1280" y2="592" stroke="#fff" stroke-opacity="0.06"/>
