  <g text-anchor="middle" font-size="15" fill="#fff">
    <circle cx="420" cy="686" r="22" fill="#fff" fill-opacity="0.07" stroke="#fff" stroke-opacity="0.12"/><text x="420" y="691">🎤</text>
    <circle cx="474" cy="686" r="22" fill="#fff" fill-opacity="0.07" stroke="#fff" stroke-opacity="0.12"/><text x="474" y="691">📷</text>
    <circle cx="528" cy="686" r="22" fill="#fff" fill-opacity="0.07" stroke="#fff" stroke-opacity="0.12"/><text x="528" y="691">⚙</text>
    <circle cx="582" cy="686" r="22" fill="#fff" fill-opacity="0.07" stroke="#fff" stroke-opacity="0.12"/><text x="582" y="691">🖐️</text>
    <circle cx="636" cy="686" r="22" fill="#fff" fill-opacity="0.07" stroke="#fff" stroke-opacity="0.12"/><text x="636" y="691">😊</text>
    <circle cx="690" cy="686" r="22" fill="#fff" fill-opacity="0.07" stroke="#fff" stroke-opacity="0.12"/><text x="690" y="691">💬</text>
    <circle cx="704" cy="672" r="8" fill="#ef4444" stroke="#18191c" stroke-width="2"/><text x="704" y="675" font-size="8" font-weight="700">3</text>
    <circle cx="744" cy="686" r="22" fill="#fff" fill-opacity="0.07" stroke="#fff" stroke-opacity="0.12"/><text x="744" y="691">🔇</text>
    <rect x="752" y="664" width="18" height="11" rx="2" fill="#facc15"/><text x="761" y="673" font-size="7" font-weight="700" fill="#000">ALL</text>
    <rect x="782" y="664" width="92" height="44" rx="22" fill="#ef4444"/><text x="828" y="691" font-size="13" font-weight="600">☎ Leave</text>
