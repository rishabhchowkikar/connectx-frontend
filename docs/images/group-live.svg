  <circle cx="333" cy="490" r="27" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.27" stroke-width="2"/>
  <text x="333" y="497" text-anchor="middle" font-size="20" font-weight="700" fill="#f59e0b">T</text>
