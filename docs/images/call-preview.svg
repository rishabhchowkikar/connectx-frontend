<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="cam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="540" rx="14" fill="#101115"/>
  <text x="24" y="32" font-size="13" fill="#818cf8" font-weight="600">/call/{roomId} — preview (hasJoined = false)</text>

  <!-- preview video -->
  <rect x="70" y="80" width="620" height="349" rx="12" fill="url(#cam)" stroke="#1f2937"/>
  <!-- person silhouette -->
  <circle cx="380" cy="215" r="58" fill="#475569"/>
  <path d="M260 429 C 270 320, 490 320, 500 429 Z" fill="#475569"/>
  <text x="380" y="120" text-anchor="middle" font-size="11" fill="#94a3b8">mirrored local preview (scaleX(-1))</text>

  <rect x="86" y="384" width="140" height="30" rx="6" fill="#000" fill-opacity="0.6"/>
  <text x="98" y="404" font-size="13" fill="#fff">You (Rishabh)</text>

  <circle cx="352" cy="399" r="24" fill="#1f2937" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="352" y="405" text-anchor="middle" font-size="16" fill="#fff">🎤</text>
  <circle cx="408" cy="399" r="24" fill="#ef4444"/>
  <text x="408" y="405" text-anchor="middle" font-size="15" fill="#fff">⊘</text>

  <!-- join panel -->
  <text x="740" y="170" font-size="30" font-weight="500" fill="#fff">Ready to join?</text>
  <text x="740" y="204" font-size="16" fill="#9ca3af">Joining as <tspan fill="#fff" font-weight="600">Rishabh</tspan></text>
  <rect x="740" y="236" width="240" height="50" rx="25" fill="#2563eb"/>
  <text x="860" y="267" text-anchor="middle" font-size="17" font-weight="500" fill="#fff">Join now</text>
  <rect x="740" y="302" width="240" height="50" rx="25" fill="none" stroke="#4b5563"/>
  <text x="860" y="333" text-anchor="middle" font-size="17" fill="#d1d5db">Cancel</text>

  <!-- states -->
  <g font-size="12">
    <text x="740" y="392" fill="#818cf8" font-weight="600">Join button states</text>
    <rect x="740" y="402" width="16" height="16" rx="8" fill="#1f2937"/><text x="764" y="415" fill="#9ca3af">"Starting camera..." — getUserMedia pending</text>
    <rect x="740" y="426" width="16" height="16" rx="8" fill="#2563eb"/><text x="764" y="439" fill="#9ca3af">"Join now" — stream ready</text>
    <rect x="740" y="450" width="16" height="16" rx="8" fill="#dc2626"/><text x="764" y="463" fill="#9ca3af">"Retry camera" — permission / device error</text>
  </g>

  <g font-size="12" fill="#818cf8">
    <text x="70" y="462">getUserMedia fallbacks:</text>
    <text x="70" y="482" fill="#9ca3af">1. { video: { facingMode: "user" }, audio: noise/echo/AGC }</text>
    <text x="70" y="500" fill="#9ca3af">2. OverconstrainedError → { video: true, audio: true }</text>
    <text x="70" y="518" fill="#9ca3af">3. NotFoundError → audio only (camera shown as off)</text>
  </g>
</svg>
